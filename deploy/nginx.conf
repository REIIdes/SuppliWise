# Hosts the built SuppliWise client and proxies it to the API container, so the
# deployed app is served from ONE origin over ONE port.
#
# ── Security headers ───────────────────────────────────────────────────────
# These are the `securityHeaders` exported by my-react-app/vite.config.js, copied
# here rather than restated from memory. `frame-ancestors` is ignored inside a
# `<meta http-equiv>` tag and only honoured as a real response header, so a
# static host that omits it is framable — clickjacking — no matter what index.html
# declares. Any nginx in front of `dist/` has to send them; this is that nginx.
#
# Note how nginx resolves `add_header`: a location that declares its own
# add_header directives INHERITS NONE of the server-level ones. The /assets and
# /index.html blocks below therefore repeat the set. Adding a header somewhere
# and wondering why framing protection vanished from those responses is the trap.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Two front doors have to agree on who the visitor is. Caddy is the only thing
# that accepts internet connections and it already sets X-Forwarded-For to the
# real peer; a phone on the LAN hits this server directly and has no such header.
# $scheme alone would call every internet visitor "http", because Caddy talks to
# nginx over http, and the app uses this header to decide what is secure.
map $http_x_forwarded_proto $real_scheme {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 11m sits just above the API's own 10 MB ceiling (JSON_UPLOAD_LIMIT_BYTES in
  # server/index.js, base64 pictures). Below the app's limit, nginx would be the
  # one answering 413 with an HTML error page, and the user would never see the
  # app's actual "image too large" message.
  client_max_body_size 11m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Server-Sent Events (utils/sse.js, hooks/useChatStream.js, the support-chat
  # push channel). Buffered proxying holds the stream in nginx until the buffer
  # fills, so expiry timers and new-message pings arrive in bursts or never —
  # the symptom is "the chat only updates when I reload".
  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Pass Caddy's chain through UNCHANGED rather than appending nginx's own
    # peer. The API runs with trust proxy = 1 hop, so it reads the RIGHTMOST
    # entry, which Caddy always writes as the true connecting address — a client
    # that forges its own X-Forwarded-For ends up to the left of it and is
    # ignored. Appending here would instead put the Caddy container's IP on the
    # right, and every visitor on earth would share one rate-limit bucket, one
    # lockout, and one "login location".
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Member pictures are served by Express OUTSIDE /api (app.use('/pictures',
  # express.static) in server/index.js), so they need their own route or every
  # avatar 404s against the dist/ folder.
  location /pictures/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_read_timeout 120s;
  }

  # Vite emits content-hashed filenames, so these are immutable for as long as
  # the build exists. index.html is the opposite: it must never be cached, or a
  # rebuild leaves visitors pointed at a bundle that no longer exists.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Client-side routing: /dashboard, /login, /assessment have no files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
